[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "0BSD",
    "Unlicense",
    "MPL-2.0",
    "Zlib",
    "CC0-1.0",
    "MIT-0",
    "Unicode-3.0",                      # Fixes icu_*, zerovec, yoke, tinystr, etc.
    "ISC",                              # Fixes libloading
    "NCSA",                             # Fixes libfuzzer-sys
    "Apache-2.0 WITH LLVM-exception",   # Fixes target-lexicon
]

[advisories]
ignore = [
    # Transitive unmaintained Unicode dependencies via Tauri v2 (urlpattern -> unic)
    "RUSTSEC-2025-0098", # unic-ucd-version
    "RUSTSEC-2025-0080", # unic-common
]