[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "0BSD",
    "Unlicense",
    "MPL-2.0",
    "Zlib",
    "CC0-1.0",
    "MIT-0",
    "Unicode-3.0",                      # Fixes icu_*, zerovec, yoke, tinystr, etc.
    "ISC",                              # Fixes libloading
    "NCSA",                             # Fixes libfuzzer-sys
    "Apache-2.0 WITH LLVM-exception",   # Fixes target-lexicon
]

[advisories]
# Ignore unmaintained advisories originating from Tauri v2 & image processing ecosystems
ignore = [
    "RUSTSEC-2024-0413", # atk
    "RUSTSEC-2024-0416", # atk-sys
    "RUSTSEC-2024-0412", # gdk
    "RUSTSEC-2024-0418", # gdk-sys
    "RUSTSEC-2024-0411", # gdkwayland-sys
    "RUSTSEC-2024-0417", # gdkx11
    "RUSTSEC-2024-0414", # gdkx11-sys
    "RUSTSEC-2024-0415", # gtk
    "RUSTSEC-2024-0420", # gtk-sys
    "RUSTSEC-2024-0419", # gtk3-macros
    "RUSTSEC-2024-0436", # paste
    "RUSTSEC-2024-0370", # proc-macro-error
    "RUSTSEC-2026-0192", # ttf-parser
    "RUSTSEC-2025-0081", # unic-char-property
    "RUSTSEC-2025-0075", # unic-char-range
    "RUSTSEC-2025-0100", # unic-ucd-ident
    "RUSTSEC-2025-0080",
    "RUSTSEC-2025-0098",
]

[bans]
multiple-versions = "allow"
skip = [
    { crate = "base64@0.21.7" },
    { crate = "cpufeatures@0.2.17" },
    { crate = "getrandom@0.2.17" },
    { crate = "getrandom@0.3.4" },
    { crate = "png@0.17.16" },
    { crate = "r-efi@5.3.0" },
    { crate = "rand@0.9.5" },
    { crate = "rand_core@0.9.5" },
    { crate = "serde_spanned@0.6.9" },
    { crate = "thiserror@1.0.69" },
    { crate = "thiserror-impl@1.0.69" },
    { crate = "toml@0.9.12+spec-1.1.0" },
    { crate = "toml_datetime@0.6.3" },
    { crate = "toml_datetime@0.7.5+spec-1.1.0" },
    { crate = "windows@0.56.0" },
    { crate = "windows-strings@0.4.2" },
    { crate = "windows-sys@0.45.0" },
    { crate = "windows-targets@0.42.2" },
    { crate = "windows_aarch64_gnullvm@0.42.2" },
    { crate = "windows_aarch64_msvc@0.42.2" },
    { crate = "windows_i686_gnu@0.42.2" },
    { crate = "windows_i686_msvc@0.42.2" },
    { crate = "windows_x86_64_gnu@0.42.2" },
    { crate = "windows_x86_64_gnullvm@0.42.2" },
    { crate = "windows_x86_64_msvc@0.42.2" },
    { crate = "winnow@0.5.40" },
    { crate = "winnow@0.7.15" },
]