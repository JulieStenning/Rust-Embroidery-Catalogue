# Trigger GitHub dependency scan refresh
[package]
name = "Rust-Embroidery-Catalogue"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[[bin]]
name = "embroidery-catalogue"
path = "src/main.rs"

[dependencies]
image = "0.25"
binrw = "0.15"
serde = { version = "1.0", features = ["derive"] }
imageproc = "0.27"
sqlx = { version = "0.9", features = ["runtime-tokio", "sqlite", "migrate"] }
tokio = { version = "1.53", features = ["full"] }
serde_json = "1.0"
blake3 = "1.8"
tauri = { version = "2.11", features = [] }
reqwest = { version = "0.13", default-features = false, features = ["json", "native-tls"] }

# Align rand and getrandom to 0.9.x / 0.3.x family to match image & tauri
rand = "0.9"
getrandom = "0.3"

# Pin base64 to match current tauri-utils / hyper ecosystem
base64 = "0.22"

# Downgrade or pin thiserror to 1.0 to avoid carrying both 1.0 and 2.0 runtimes
thiserror = "2.0"

rfd = "0.17"
trash = "5.2"
fs4 = { version = "1.1", features = ["sync"] }
tracing = { version = "0.1", features = ["log"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
Inflector = "0.11"
time = { version = "0.3", features = ["formatting", "local-offset"] }

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dev-dependencies]
serial_test = "4.0"
tauri = { version = "2", features = ["test"] }
mockito = "1"
